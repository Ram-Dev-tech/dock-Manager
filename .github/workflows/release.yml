name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore DockManager.sln

      - name: Build Release
        run: dotnet build DockManager.sln --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test tests/DockManager.Core.Tests/DockManager.Core.Tests.csproj --configuration Release --no-build

      - name: Publish Single-File Executable
        run: |
          dotnet publish src/DockManager.App/DockManager.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=embedded `
            --output publish
          
      - name: Get Version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -oP '<Version>\K[^<]+' Directory.Build.props)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version $VERSION"

      - name: Create Release Assets
        run: |
          mkdir release-assets
          copy publish\DockManager.exe release-assets\DockManager-${{ steps.version.outputs.version }}.exe
          copy publish\DockManager.exe release-assets\DockManager.exe
          copy LICENSE release-assets\
          
          # Create checksums
          cd release-assets
          $hash = Get-FileHash DockManager-${{ steps.version.outputs.version }}.exe -Algorithm SHA256
          "$($hash.Hash)  DockManager-${{ steps.version.outputs.version }}.exe" > checksums.txt
          $hash = Get-FileHash DockManager.exe -Algorithm SHA256
          "$($hash.Hash)  DockManager.exe" >> checksums.txt

      - name: Upload Executable
        uses: actions/upload-artifact@v4
        with:
          name: DockManager-Executable
          path: release-assets/DockManager-${{ steps.version.outputs.version }}.exe
          retention-days: 30

      - name: Upload Portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: DockManager-Portable
          path: release-assets/DockManager.exe
          retention-days: 30

      - name: Upload Checksums
        uses: actions/upload-artifact@v4
        with:
          name: DockManager-Checksums
          path: release-assets/checksums.txt
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Download Executable
        uses: actions/download-artifact@v4
        with:
          name: DockManager-Executable
          path: release-artifacts/

      - name: Download Portable EXE
        uses: actions/download-artifact@v4
        with:
          name: DockManager-Portable
          path: release-artifacts/

      - name: Download Checksums
        uses: actions/download-artifact@v4
        with:
          name: DockManager-Checksums
          path: release-artifacts/

      - name: Get Version
        id: version
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Dock Manager v${{ steps.version.outputs.version }}
          body: |
            ## Dock Manager v${{ steps.version.outputs.version }}
            
            ### First Public Release
            
            Dock Manager v${{ steps.version.outputs.version }} is the first installable version of the project.
            
            ### Included
            
            - Vertical dock on left or right edge
            - Auto reveal/hide with smooth animation
            - Pin applications, files, and folders
            - Detect and switch to running applications
            - Chrome and Edge tab integration
            - VS Code project/document integration
            - File Explorer folder integration
            - Groups and separators for organization
            - Drag-and-drop reordering
            - Configurable global shortcuts
            - Light/Dark/System theme support
            - Multi-monitor support with DPI scaling
            - Startup with Windows
            - Tray icon
            - Fully offline operation
            
            ### Installation
            
            **Option 1: Direct Download (Recommended)**
            1. Download `DockManager-${{ steps.version.outputs.version }}.exe`
            2. Run the executable
            3. The dock will appear in the system tray
            4. Move your cursor to the left edge of your screen to reveal the dock
            
            **Option 2: PowerShell**
            ```powershell
            Invoke-WebRequest -Uri "https://github.com/Ram-Dev-tech/dock-Manager/releases/download/v${{ steps.version.outputs.version }}/DockManager-${{ steps.version.outputs.version }}.exe" -OutFile "$env:USERPROFILE\Desktop\DockManager.exe"
            Start-Process "$env:USERPROFILE\Desktop\DockManager.exe"
            ```
            
            ### Offline
            
            The application's core functionality works without an internet connection.
            
            ### Known Limitations
            
            - Pre-1.0 release (some features may change)
            - Single-instance only (second launch focuses existing instance)
            - Portable mode only (no installer yet)
            
            ### Feedback
            
            Please report issues or feature requests on the GitHub repository.
          files: |
            release-artifacts/DockManager-${{ steps.version.outputs.version }}.exe
            release-artifacts/DockManager.exe
            release-artifacts/checksums.txt
          draft: false
          prerelease: true
