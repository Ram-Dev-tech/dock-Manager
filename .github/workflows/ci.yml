name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Core unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: >
          dotnet test tests/DockManager.Core.Tests/DockManager.Core.Tests.csproj
          --configuration Release
          --logger "trx;LogFileName=core-tests.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-results
          path: TestResults
          if-no-files-found: ignore

  windows:
    name: Build app (Windows)
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore DockManager.sln

      - name: Build
        run: dotnet build DockManager.sln --configuration Release --no-restore

      - name: Upload build warnings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-output
          path: src/DockManager.App/bin/Release/net8.0-windows/
          if-no-files-found: ignore
